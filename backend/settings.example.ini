[pharmacy]
; path to DocAssist's config.ini and which section of it to use
docassist_config = D:/abhinay/DocAssist/pyDocAssist/config.ini
docassist_env = test
; must equal the secret key DocAssist signs its login cookie with
session_secret = CHANGE_ME
session_timeout_minutes = 720
; optional: hospital for a login that has none (DocAssist uses 1); leave out to refuse such logins
; default_hospital_id = 1
